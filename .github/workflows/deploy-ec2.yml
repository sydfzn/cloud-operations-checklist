name: Build and deploy to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MSSQL_CONNECTION_STRING: ${{ secrets.MSSQL_CONNECTION_STRING }}
      DB_PROVIDER: mssql

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify complete source tree
        run: |
          test -d client
          test -d server
          test -d shared
          test -d database || test -d drizzle

      - name: Run database migrations
        run: pnpm drizzle-kit push

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Run tests
        run: pnpm vitest run

      - name: Build application
        run: pnpm build

      - name: Package build artifacts
        run: |
          mkdir -p deploy-package
          cp -r dist deploy-package/ 2>/dev/null || true
          cp package.json deploy-package/
          cp pnpm-lock.yaml deploy-package/
          tar -czf deploy-package.tar.gz deploy-package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: deploy-package.tar.gz
          retention-days: 5

  deploy:
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          scp -i ~/.ssh/deploy_key deploy-package.tar.gz ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'DEPLOY_SCRIPT'
            cd /opt/app
            tar -xzf /tmp/deploy-package.tar.gz --strip-components=1
            pnpm install --frozen-lockfile --prod
            pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js
            rm /tmp/deploy-package.tar.gz
          DEPLOY_SCRIPT

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts

